# strudel build configuration
# See `strudel help config` for the full list of options.

[app]
name         = "Carrot"
bundle_id    = "com.breakfastlabs.carrot"
version      = "0.2.0"
# build_number = "1"  # optional, defaults to "1"

[build]
target_name            = "CarrotApp"  # Swift target name; app.name is just the bundle
icon.src               = "assets/carrot.png"
# icon.scale             = 1.2         # optional
icon.background        = "#1B3A52"

resources              = ["Resources/carrot-media.pl"]

# The media shim is loaded into /usr/bin/perl at runtime, never by Carrot, so it
# is copied rather than embedded: embed_libs expects the executable to link the
# dylib and rewrites its load command. It still needs signing of its own for
# notarization. See research/2026-08-31-mediaremote-perl-adapter.md.
[[build.copy]]
#
# Unlike `resources` and `embed_libs`, `src` here has no .build fallback, so the
# triple is spelled out. Setting `archs` for a universal build changes that path
# and this line has to change with it; the build fails loudly if it doesn't.
src      = ".build/arm64-apple-macosx/release/libCarrotMediaShim.dylib"
dest_dir = "Contents/Frameworks"
sign     = true

# Apple developer identifiers, used for signing and notarization.
# Can also be set via env vars.
# [apple]
# identity     = "Developer ID Application: Your Name (XXXXXXXXXX)"
# team_id      = "XXXXXXXXXX"
# api_key      = "2X9R4HXF34"
# api_key_path = "AuthKey_2X9R4HXF34.p8"

# A DMG with a styled Finder window is created by default for `strudel release`.
# See help for customizing the DMG window.
# Set plain = true for a plain unstyled DMG instead.
# [dmg]
# plain = true
